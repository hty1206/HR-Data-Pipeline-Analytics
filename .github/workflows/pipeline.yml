name: HR Data ELＴ Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # 台灣時間早上 10 點
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安裝必要依賴
        run: |
          pip install sqlalchemy pymysql python-dotenv

      - name: 執行 SQL 轉換管線
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python scripts/run_sql_pipeline.py
